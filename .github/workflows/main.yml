name: 🚀 Automatic MyPortfolio Deploy on pull_request or commits

on:
  push:
    branches:
      - master
      - main
  # The project list is generated at build time, so a periodic run keeps it in
  # step with GitHub without needing a commit.
  schedule:
    - cron: '0 6 * * 1'          # Mondays, 06:00 UTC
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    # The FTP action's `exclude` globs were silently ignored — .git/, LICENSE,
    # README.txt and assets/imgs/_sources/ all reached the server despite being
    # listed. Assembling an explicit publish directory removes the guesswork:
    # only what is copied here can possibly be uploaded.
    - name: 🏗️ Assemble publish directory
      run: |
        set -euo pipefail
        rm -rf _site
        mkdir -p _site/assets/imgs

        cp index.html .htaccess robots.txt sitemap.xml humans.txt _site/
        cp -R assets/css _site/assets/
        cp -R assets/js  _site/assets/

        # only the images the site actually serves — _sources/ stays behind
        cp assets/imgs/avatar_head.jpg _site/assets/imgs/
        cp assets/imgs/favicon.png     _site/assets/imgs/

        echo "--- publishing $(find _site -type f | wc -l) files ---"
        true

    # Deciding "did I actually contribute?" costs one API call per repository.
    # Doing that in the browser would be ~19 unauthenticated calls against a
    # limit of 60/hour per IP, so it is resolved here instead and the page just
    # reads a static file — no GitHub API calls from visitors at all.
    - name: 📋 Build the project list
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        python3 tools/build-projects.py _site/projects.json
        echo "--- publishing $(find _site -type f | wc -l) files ---"
        find _site -type f | sort
        du -sh _site

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ftp.alessandrodiscalzi.com
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./_site/
        server-dir: /www.alessandrodiscalzi.com/
        # dangerous-clean-slate was enabled for exactly one run (1ab489d) to
        # reset a corrupt server sync-state and clear files a broken exclude
        # list had leaked. It is deliberately gone again: left on, every deploy
        # would wipe the whole site first, taking it offline for minutes and
        # turning any mid-run failure into a dead site.
