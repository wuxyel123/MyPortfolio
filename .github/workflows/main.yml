name: 🚀 Automatic MyPortfolio Deploy on pull_request or commits

on:
  push:
    branches:
      - master
      - main
  # The project list is generated at build time, so a periodic run keeps it in
  # step with GitHub without needing a commit. Daily, so a new repository shows
  # up within a day rather than within a week.
  schedule:
    - cron: '0 6 * * *'          # every day, 06:00 UTC
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    # The FTP action's `exclude` globs were silently ignored — .git/, LICENSE,
    # README.txt and assets/imgs/_sources/ all reached the server despite being
    # listed. Assembling an explicit publish directory removes the guesswork:
    # only what is copied here can possibly be uploaded.
    - name: 🏗️ Assemble publish directory
      run: |
        set -euo pipefail
        rm -rf _site
        mkdir -p _site/assets/imgs

        cp index.html 404.html .htaccess robots.txt humans.txt _site/
        cp -R assets/css _site/assets/
        cp -R assets/js  _site/assets/

        # only the images the site actually serves — _sources/ stays behind
        cp assets/imgs/avatar_head.jpg _site/assets/imgs/
        cp assets/imgs/favicon.png     _site/assets/imgs/

        # sitemap carries the deploy date rather than a hardcoded one
        sed "s|<lastmod>[^<]*</lastmod>|<lastmod>$(date -u +%F)</lastmod>|" \
            sitemap.xml > _site/sitemap.xml
        grep -o '<lastmod>[^<]*</lastmod>' _site/sitemap.xml

    # Deciding "did I actually contribute?" costs one API call per repository.
    # Doing that in the browser would be ~19 unauthenticated calls against a
    # limit of 60/hour per IP, so it is resolved here instead and the page just
    # reads a static file — no GitHub API calls from visitors at all.
    - name: 📋 Build the project list
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        python3 tools/build-projects.py _site/projects.json

    # The CV was previously only obtainable through the browser's print dialog,
    # which also meant no URL to paste into an application form. Rendering it
    # here uses the same print.css, so the file matches what printing produces.
    - name: 📄 Render the CV to PDF
      run: |
        set -euo pipefail
        python3 -m http.server 8099 --directory _site &>/dev/null &
        SERVER=$!
        trap 'kill $SERVER 2>/dev/null || true' EXIT
        for i in $(seq 1 30); do
          curl -sf http://localhost:8099/ -o /dev/null && break
          sleep 0.5
        done
        google-chrome --headless --disable-gpu --no-sandbox \
          --virtual-time-budget=8000 --no-pdf-header-footer \
          --print-to-pdf=_site/cv.pdf http://localhost:8099/
        ls -la _site/cv.pdf

    # og:image wants roughly 1200x630. Pointing it at the 360px avatar made
    # LinkedIn and WhatsApp render a small square thumbnail or drop it entirely.
    #
    # Shipped as PNG straight from Chrome. Converting to JPEG needed Pillow,
    # which ubuntu-latest does not ship — that import failed the job, and since
    # this step runs before the sync, nothing deployed at all.
    #
    # virtual-time-budget is required: without it Chrome captures before the
    # avatar has decoded and the card renders with an empty circle.
    - name: 🖼️ Render the social preview card
      run: |
        set -euo pipefail
        google-chrome --headless --disable-gpu --no-sandbox --hide-scrollbars \
          --virtual-time-budget=5000 --window-size=1200,630 \
          --screenshot=_site/assets/imgs/og.png \
          "file://$PWD/tools/og-card.html"
        ls -la _site/assets/imgs/og.png
        python3 -c "
        import struct
        d = open('_site/assets/imgs/og.png','rb').read()
        w, h = struct.unpack('>II', d[16:24])
        print('og.png is %dx%d' % (w, h))
        assert (w, h) == (1200, 630), 'unexpected card size'
        "

    - name: 📦 Publishing
      run: |
        echo "--- publishing $(find _site -type f | wc -l) files ---"
        find _site -type f | sort
        du -sh _site

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ftp.alessandrodiscalzi.com
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./_site/
        server-dir: /www.alessandrodiscalzi.com/
        # dangerous-clean-slate was enabled for exactly one run (1ab489d) to
        # reset a corrupt server sync-state and clear files a broken exclude
        # list had leaked. It is deliberately gone again: left on, every deploy
        # would wipe the whole site first, taking it offline for minutes and
        # turning any mid-run failure into a dead site.
