name: 🚀 Automatic MyPortfolio Deploy on pull_request or commits

on:
  pull_request:
    branches: 
      - master
      - main
    types: [closed]
    paths-ignore:
      - '**/.git*'
      - '**/.git*/**'
      - '**/OriginalTemplate.zip'
      - '**/.gitignore'
      - '**/.DS_Store'
      - '**/.README.txt'
  push:
    branches: 
      - master
      - main
    paths-ignore:
      - '**/.git*'
      - '**/.git*/**'
      - '**/OriginalTemplate.zip'
      - '**/.gitignore'
      - '**/.DS_Store'
      - '**/.README.txt'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@4.1.0
      with:
        server: ftp.alessandrodiscalzi.com
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /www.alessandrodiscalzi.com/
        # Setting this replaces the action's defaults, so the .git/node_modules
        # patterns have to be repeated here.
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          assets/imgs/_sources/**
          LICENSE
          README.txt
          
