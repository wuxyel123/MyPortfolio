<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found — Alessandro Discalzi</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <link rel="icon" href="/assets/imgs/favicon.png" type="image/png">
    <link rel="stylesheet" href="/assets/css/main.css">
    <script>
        (function () {
            var stored = null;
            try { stored = localStorage.getItem('theme'); } catch (e) { /* private mode */ }
            var dark = stored ? stored === 'dark'
                : window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        })();
    </script>
    <style>
        /* Standalone page — no slide deck, so it brings its own layout. */
        body {
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 2rem 1.25rem;
            overflow-x: hidden;
            background:
                radial-gradient(900px 500px at 50% -10%, var(--accent-soft), transparent 68%),
                linear-gradient(180deg, var(--bg-alt), var(--bg));
        }

        .oops {
            position: relative;
            width: min(100%, 30rem);
            text-align: center;
            padding: clamp(2.25rem, 6vw, 3.25rem) clamp(1.5rem, 5vw, 3rem) clamp(2rem, 5vw, 2.75rem);
            background: color-mix(in srgb, var(--surface) 82%, transparent);
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(10px);
            animation: rise .55s cubic-bezier(.22, .75, .28, 1) both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(14px) scale(.985); }
            to   { opacity: 1; transform: none; }
        }

        .oops-avatar {
            width: 76px; height: 76px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 1.5rem;
            border: 3px solid var(--surface);
            box-shadow: 0 0 0 1px var(--border), var(--shadow);
        }

        /* .oops .oops-code, never .oops-code: the numeral is a <p>, so the
           `.oops p` rule below outranks a lone class selector and would shrink
           it back to body size. This exact trap already cost one round.

           background-clip needs a transparent fill, so the colour is declared
           first as the fallback for anything that ignores it. */
        .oops .oops-code {
            margin: 0;
            font-family: var(--font-mono);
            font-size: clamp(5rem, 22vw, 8.5rem);
            font-weight: 700;
            line-height: .9;
            letter-spacing: -.06em;
            color: var(--accent);
            background: linear-gradient(135deg, var(--accent) 15%, var(--accent-strong) 85%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .oops h1 {
            font-size: clamp(1.15rem, 3.6vw, 1.4rem);
            margin: 1.1rem 0 .55rem;
            letter-spacing: -.01em;
        }

        .oops p {
            color: var(--text-muted);
            font-size: .95rem;
            margin: 0 auto;
            max-width: 30ch;
        }

        .oops .btn { margin-top: 1.9rem; }

        @media (prefers-reduced-motion: reduce) {
            .oops { animation: none; }
        }
    </style>
</head>
<body>
    <main class="oops">
        <img class="oops-avatar" src="/assets/imgs/avatar_head.jpg"
             alt="Alessandro Discalzi" width="360" height="360">

        <p class="oops-code">404</p>
        <h1>This page does not exist</h1>
        <p>The link may be out of date, or I moved something.</p>

        <a class="btn btn-primary" href="/">Back to the site</a>
    </main>
</body>
</html>
