<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found — Alessandro Discalzi</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <link rel="icon" href="/assets/imgs/favicon.png" type="image/png">
    <link rel="stylesheet" href="/assets/css/main.css">
    <script>
        (function () {
            var stored = null;
            try { stored = localStorage.getItem('theme'); } catch (e) { /* private mode */ }
            var dark = stored ? stored === 'dark'
                : window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        })();
    </script>
    <style>
        /* Standalone page — no slide deck, so it brings its own layout. The
           glow and card styling are lifted from the hero so a wrong URL still
           looks like part of the site. */
        body {
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 2rem 0;
            background:
                radial-gradient(820px 420px at 50% 0%, var(--accent-soft), transparent 65%),
                linear-gradient(180deg, var(--bg-alt), var(--bg));
        }

        .oops { text-align: center; }

        .oops-avatar {
            width: 96px; height: 96px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 1.75rem;
            border: 4px solid var(--surface);
            box-shadow: 0 0 0 1px var(--border), var(--shadow-lg);
        }

        .oops h1 { font-size: clamp(1.5rem, 4vw, 2.1rem); margin: 0 0 .6rem; }
        .oops p { color: var(--text-muted); max-width: 46ch; margin: 0 auto 1rem; }

        /* .oops .oops-code, not .oops-code: the digits are a <p>, so the rule
           above would otherwise win on specificity and mute them. */
        .oops .oops-code {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: .82rem; font-weight: 700;
            letter-spacing: .22em; text-transform: uppercase;
            color: var(--accent);
            background: var(--accent-soft);
            border: 1px solid var(--accent-ring);
            border-radius: 999px;
            padding: .3rem 1rem;
            margin: 0 0 1.4rem;
        }

        .oops-links {
            display: flex; flex-wrap: wrap; gap: .6rem;
            justify-content: center; margin-top: 2rem;
        }
        .oops-links .btn { padding: .55rem 1.1rem; font-size: .9rem; }
        .oops-home { margin-top: 1.75rem; }
    </style>
</head>
<body>
    <main class="wrap oops">
        <img class="oops-avatar" src="/assets/imgs/avatar_head.jpg"
             alt="Alessandro Discalzi" width="360" height="360">

        <p class="oops-code">Error 404</p>
        <h1>This page does not exist</h1>
        <p>
            The link may be out of date, or I may have moved something. The whole
            site lives on a single page, so everything is one click away.
        </p>

        <p class="oops-home">
            <a class="btn btn-primary" href="/">Back to the site</a>
        </p>

        <div class="oops-links">
            <a class="btn btn-outline" href="/#about">About</a>
            <a class="btn btn-outline" href="/#resume">Resume</a>
            <a class="btn btn-outline" href="/#projects">Projects</a>
            <a class="btn btn-outline" href="/#contact">Contact</a>
            <a class="btn btn-outline" href="/cv.pdf">CV (PDF)</a>
        </div>
    </main>
</body>
</html>
