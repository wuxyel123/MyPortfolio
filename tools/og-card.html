<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card</title>
<!--
  Screenshotted at 1200x630 during the build to produce the social preview
  image. Kept as its own file rather than drawn in code so the card can be
  opened directly in a browser. Colours are copied from the dark theme in main.css
  rather than imported, so this stays a single self-contained page.
-->
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { width: 1200px; height: 630px; }

    body {
        display: flex;
        align-items: center;
        gap: 64px;
        padding: 0 88px;
        background:
            radial-gradient(760px 420px at 78% 8%, rgba(251, 146, 60, .16), transparent 62%),
            linear-gradient(160deg, #0f1626 0%, #0b1120 100%);
        color: #e6ebf3;
        font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
    }

    .portrait {
        width: 260px; height: 260px;
        flex: none;
        border-radius: 50%;
        object-fit: cover;
        border: 6px solid #121a2b;
        box-shadow: 0 0 0 2px #22304a, 0 30px 60px -20px rgba(0, 0, 0, .85);
    }

    .eyebrow {
        font-size: 21px; font-weight: 600; letter-spacing: .18em;
        text-transform: uppercase; color: #fb923c; margin-bottom: 14px;
    }

    h1 {
        font-size: 74px; font-weight: 700; letter-spacing: -.03em;
        line-height: 1.02; margin-bottom: 16px;
    }

    .role {
        font-size: 30px; color: #9aa8bd; margin-bottom: 30px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }

    .stack { display: flex; flex-wrap: wrap; gap: 10px; max-width: 640px; }
    .stack span {
        font-size: 20px; padding: 7px 16px; border-radius: 999px;
        background: #182136; border: 1px solid #22304a; color: #cbd5e6;
    }

    .domain {
        position: absolute; right: 88px; bottom: 54px;
        font-size: 21px; color: #64748b; letter-spacing: .04em;
    }
</style>
</head>
<body>
    <img class="portrait" src="../assets/imgs/avatar_head.jpg" alt="">
    <div>
        <p class="eyebrow">Software Engineer</p>
        <h1>Alessandro<br>Discalzi</h1>
        <p class="role">Backend &amp; cloud, Padua IT</p>
        <div class="stack">
            <span>Java</span><span>Spring Boot</span><span>Spring Batch</span>
            <span>Apache Camel</span><span>Oracle</span><span>AWS</span>
        </div>
    </div>
    <p class="domain">alessandrodiscalzi.com</p>
</body>
</html>
